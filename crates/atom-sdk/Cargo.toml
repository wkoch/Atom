[package]
name = "atom-sdk"
version = "0.9.0"
edition = "2024"
rust-version = "1.89.0"
license = "MIT"
description = "SDK Rust mínimo para extensões atom/1 (sobre atom-protocol)"

[dependencies]
atom-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync", "time"] }
