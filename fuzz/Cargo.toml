[package]
name = "atom-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
atom-protocol = { path = "../crates/atom-protocol" }
serde_json = "1"
toml = { version = "0.8", features = ["parse", "display"] }
tar = "0.4"
flate2 = "1"

[[bin]]
name = "gen-corpus"
path = "gen_corpus.rs"
