[workspace]
members = ["crates/atom-protocol", "crates/atom-core", "crates/atom", "crates/atom-sdk", "testdata/echo", "testdata/fake-llm", "testdata/prompt-fake", "testdata/mcp-fake", "testdata/crash", "testdata/caller", "testdata/intercept-fake", "testdata/evil", "testdata/flood"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.89.0"
license = "MIT"

[workspace.dependencies]
atom-protocol = { path = "crates/atom-protocol" }
atom-core = { path = "crates/atom-core" }
atom-sdk = { path = "crates/atom-sdk" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "net", "sync", "time", "signal", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", features = ["parse", "display"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
semver = { version = "1", features = ["serde"] }
ulid = "1"
sha2 = "0.10"
# v0.5 loja: assinaturas ed25519 (spec store §4) + CSPRNG p/ keygen.
ed25519-dalek = "2"
base64 = "0.22"
rand = "0.8"
# v0.7 auto-update: troca atômica do executável (Linux/macOS/Windows).
self-replace = "1"
# v0.8 Web: ponte WS do daemon (`serve --ws`) — tokio-tungstenite + futures-util
# (Sink/StreamExt p/ framing; justificativa AGENTS.md: sem elas não há WS).
tokio-tungstenite = "0.26"
futures-util = "0.3"
tar = "0.4"
flate2 = "1"
tempfile = "3"
keyring = "4"
globset = "0.4"
# Sem `resolve-http` (padrão): validação nunca busca `$ref` pela rede; schemas são locais.
jsonschema = { version = "0.33", default-features = false, features = ["resolve-file"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1"
# v1.1 peer/Jobs (ADR-019): `libc` = syscalls crus (`SO_PEERCRED`, `prctl`,
# `LOCAL_PEERPID`) sem lib C — mantém cross-compile/musl estático (AGENTS.md §15).
libc = "0.2"
