manifest = 1
name = "atom/ui-cli"
version = "0.2.0"
kind = "extension"
description = "Chat no terminal (comando `chat`)"
license = "MIT"
engine = ">=0.1.0"
protocol = "atom/1"
entrypoint = "bin/ui-cli"
activation = ["onCommand:chat"]

[contributes.commands]
chat = { description = "Chat no terminal", interactive = true }
